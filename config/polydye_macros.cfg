# PolyDye macros. Installed with the add-on and loaded automatically while the PolyDye board is plugged in
# (polydye-toggle.sh includes this file), so they appear in Mainsail's Macros panel only then.
#
# This file is loaded before polydye.cfg, so you can change a macro's defaults there without editing this file
# (which would stop Mainsail updating the add-on). For example, in polydye.cfg:
#   [gcode_macro POLYDYE_WIPE]
#   variable_strokes: 5
#
# This file is part of polydye-klipper (GPLv3).

[gcode_macro PD_STATUS]
description: PolyDye board status
gcode:
  POLYDYE_STATUS

[gcode_macro PD_DRY_RUN_TEST]
description: PolyDye dry run, no ink: two test passes 20 mm above the bed (homes first if needed)
gcode:
  {% set x = params.X|default(100)|float %}
  {% set y = params.Y|default(40)|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=pd_dry_run
  G90
  G1 Z20 F900
  POLYDYE_UPLOAD_TEST_PASS LAYER=0 PASS=0 COLUMNS=600
  POLYDYE_ENABLE LIVE=0
  POLYDYE_PASS LAYER=0 PASS=0 X={x} Y={y} DIR=1
  POLYDYE_PASS LAYER=0 PASS=0 X={x} Y={y} DIR=-1
  M400
  POLYDYE_DISABLE
  POLYDYE_STATUS
  RESTORE_GCODE_STATE NAME=pd_dry_run

[gcode_macro PD_FIRE_TEST]
description: PolyDye fire test, LIVE INK on paper: one stripe per template/pulse pair, side by side (homes first if needed)
# STRIPES is TEMPLATE:PULSE,... (pulse in words of 0.3 us). The stripes run along pass_axis and sit SPACING mm apart
# across it, the first at X, Y. The template and pulse go back to what they were afterwards.
gcode:
  {% set x = params.X|default(80)|float %}
  {% set y = params.Y|default(60)|float %}
  {% set z = params.Z|default(0.5)|float %}
  {% set spacing = params.SPACING|default(20)|float %}
  {% set stripes = params.STRIPES|default("color_b:6,color_b:8,color_b:10,color_a:6,color_a:10") %}
  {% if z < 0.2 %}
    {action_raise_error("PD_FIRE_TEST: Z must be at least 0.2 mm")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=pd_fire_test
  G90
  G1 Z{z} F900
  POLYDYE_FIRE_TEST X={x} Y={y} SPACING={spacing} STRIPES={stripes}
  RESTORE_GCODE_STATE NAME=pd_fire_test

[gcode_macro PD_OFF]
description: PolyDye off: drop queued passes, then live output and boost off
gcode:
  POLYDYE_CANCEL
  POLYDYE_DISABLE

[gcode_macro POLYDYE_WIPE]
description: Wipe the cartridge on the sponge at the right end of the X gantry, then return (homes first if needed)
# Strokes run between X and X - LENGTH (G-code coordinates). X is where the cartridge reaches the sponge on the
# PolyDye mount; it must stay below the X axis maximum (the hard stop), or the wipe is refused. The check uses the
# current G-code offset (including G92) when homed, and the homing origin when G28 is still to come.
variable_x: 245
variable_length: 25
variable_strokes: 3
variable_speed: 50
variable_travel_speed: 150
variable_z_hop: 1
gcode:
  {% set gm = printer.gcode_move %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set shift = gm.position.x - gm.gcode_position.x %}
  {% else %}
    {% set shift = gm.homing_origin.x %}
  {% endif %}
  {% set x_max = printer.toolhead.axis_maximum.x - shift %}
  {% set x_min = printer.toolhead.axis_minimum.x - shift %}
  {% set end = params.X|default(x)|float %}
  {% set stroke = params.LENGTH|default(length)|float %}
  {% if end >= x_max %}
    {action_raise_error("POLYDYE_WIPE: X=%.1f is at or beyond the X axis maximum (%.1f); use an X below it"
                        % (end, x_max))}
  {% endif %}
  {% if stroke <= 0 or end - stroke < x_min %}
    {action_raise_error("POLYDYE_WIPE: LENGTH must be positive and X - LENGTH within the X axis")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _POLYDYE_WIPE_MOVES X={end} LENGTH={stroke} STROKES={params.STROKES|default(strokes)|int} SPEED={params.SPEED|default(speed)|float} Z_HOP={params.Z_HOP|default(z_hop)|float} TRAVEL={travel_speed|float}

# Runs after any homing, so it sees the current position. Called only by POLYDYE_WIPE, which checks the values.
[gcode_macro _POLYDYE_WIPE_MOVES]
gcode:
  {% set gm = printer.gcode_move %}
  {% set end = params.X|float %}
  {% set length = params.LENGTH|float %}
  {% set strokes = params.STROKES|int %}
  {% set speed = params.SPEED|float * 60 %}
  {% set travel = params.TRAVEL|float * 60 %}
  {% set pos = gm.gcode_position %}
  {% set z_up = [pos.z + params.Z_HOP|float, printer.toolhead.axis_maximum.z - (gm.position.z - pos.z)]|min %}
  SAVE_GCODE_STATE NAME=polydye_wipe
  G90
  G1 Z{z_up} F900
  G1 X{end} F{travel}
  {% for i in range(strokes) %}
    G1 X{end - length} F{speed}
    G1 X{end} F{speed}
  {% endfor %}
  G1 X{pos.x} F{travel}
  RESTORE_GCODE_STATE NAME=polydye_wipe MOVE=1 MOVE_SPEED=15
