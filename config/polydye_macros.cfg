# PolyDye macros. Installed with the add-on and loaded automatically while the PolyDye board is plugged in
# (polydye-toggle.sh includes this file), so they appear in Mainsail's Macros panel only then.
#
# This file is loaded before polydye.cfg, so you can change a macro's defaults there without editing this file
# (which would stop Mainsail updating the add-on). For example, in polydye.cfg:
#   [gcode_macro POLYDYE_WIPE]
#   variable_strokes: 5
#
# This file is part of polydye-klipper (GPLv3).

[gcode_macro PD_STATUS]
description: PolyDye board status
gcode:
  POLYDYE_STATUS

[gcode_macro PD_DRY_RUN_TEST]
description: PolyDye dry run, no ink: two test passes 20 mm above the bed (homes first if needed)
gcode:
  {% set x = params.X|default(100)|float %}
  {% set y = params.Y|default(40)|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=pd_dry_run
  G90
  G1 Z20 F900
  POLYDYE_UPLOAD_TEST_PASS LAYER=0 PASS=0 COLUMNS=600
  POLYDYE_ENABLE LIVE=0
  POLYDYE_PASS LAYER=0 PASS=0 X={x} Y={y} DIR=1
  POLYDYE_PASS LAYER=0 PASS=0 X={x} Y={y} DIR=-1
  M400
  POLYDYE_DISABLE
  POLYDYE_STATUS
  RESTORE_GCODE_STATE NAME=pd_dry_run

[gcode_macro PD_OFF]
description: PolyDye off: drop queued passes, then live output and boost off
gcode:
  POLYDYE_CANCEL
  POLYDYE_DISABLE

[gcode_macro POLYDYE_WIPE]
description: Wipe the cartridge on the sponge at the right end of the X gantry, then return (homes first if needed)
# Strokes run between X and X - LENGTH. X = 0 means the X axis maximum.
variable_x: 0
variable_length: 25
variable_strokes: 3
variable_speed: 50
variable_travel_speed: 150
variable_z_hop: 1
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _POLYDYE_WIPE_MOVES {rawparams}

[gcode_macro _POLYDYE_WIPE_MOVES]
gcode:
  {% set v = printer["gcode_macro POLYDYE_WIPE"] %}
  {% set origin = printer.gcode_move.homing_origin %}
  {% set end = params.X|default(v.x)|float %}
  {% if end <= 0 %}
    {% set end = printer.toolhead.axis_maximum.x - origin.x %}
  {% endif %}
  {% set length = params.LENGTH|default(v.length)|float %}
  {% set strokes = params.STROKES|default(v.strokes)|int %}
  {% set speed = params.SPEED|default(v.speed)|float * 60 %}
  {% set travel = v.travel_speed|float * 60 %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set z_up = [pos.z + params.Z_HOP|default(v.z_hop)|float, printer.toolhead.axis_maximum.z - origin.z]|min %}
  SAVE_GCODE_STATE NAME=polydye_wipe
  G90
  G1 Z{z_up} F900
  G1 X{end} F{travel}
  {% for i in range(strokes) %}
    G1 X{end - length} F{speed}
    G1 X{end} F{speed}
  {% endfor %}
  G1 X{pos.x} F{travel}
  RESTORE_GCODE_STATE NAME=polydye_wipe MOVE=1 MOVE_SPEED=15
