name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Jinja2 (Klipper's macro engine, for the macro tests) and numpy (for polydye_post.py)
        run: python3 -m pip install -q jinja2 numpy
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install / uninstall round trip
        run: bash tests/test_install.sh
      - name: Lint shell scripts
        run: shellcheck install.sh uninstall.sh scripts/polydye-toggle.sh tests/test_install.sh
      - name: Check Python and JavaScript syntax
        run: |
          python3 -m py_compile klipper/polydye.py moonraker/polydye.py scripts/*.py
          node --check web/polydye.js
